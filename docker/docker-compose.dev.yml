name: udesa-x-users-api

services:
  users-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://users:users@postgres:5432/users
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://users:users@rabbitmq:5672
      PUBLIC_BASE_URL: http://localhost:8000
      POSTS_API_URL: http://host.docker.internal:8001
      # First superadmin credentials, development only. Production gets them
      # through GitHub Secrets. The seed does nothing when the account already exists.
      SUPERADMIN_EMAIL: admin@udesa.edu.ar
      SUPERADMIN_PASSWORD: Admin1234
      # Local backoffice origins: Vite (5173) and the nginx container (5174).
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:5174"]'
      # Same value as posts-api's compose, so its reports can reach /internal.
      INTERNAL_API_TOKEN: dev-internal-token
      # JWT_PRIVATE_KEY is left unset on purpose: development mints an ephemeral
      # pair, so no key is ever versioned. Production gets it through a Secret.
    command: >-
      sh -c "alembic upgrade head &&
             python -m users_api.seed_superadmin &&
             uvicorn users_api.main:app --host 0.0.0.0 --port 8000 --workers 1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # No source volume on purpose: mounting it would replace what the image
  # carries and stop testing the real artifact.
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://users:users@postgres:5432/users
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://users:users@rabbitmq:5672
      INTERNAL_API_TOKEN: test-internal-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Without this it would start on every `docker compose up`.
    profiles: ["test"]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # PostgreSQL 18 stores data in a version-specific subdirectory, so the mount
      # goes on /var/lib/postgresql and not on /data as in earlier versions.
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: users
      RABBITMQ_DEFAULT_PASS: users
    # Only on loopback: the broker has no business being reachable from the network.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
