name: Agregar issues al Project
on:
  issues:
    types: [opened, reopened]
jobs:
  add-to-project:
    # Solo las issues del equipo entran al tablero. Los repos son publicos por
    # el ADR-003, asi que cualquiera con una cuenta de GitHub puede abrir una, y
    # sin este filtro cae en el Kanban que revisa el tutor.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/tds-g3-2s2026/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}