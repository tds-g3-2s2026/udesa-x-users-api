name: Agregar issues al Project
on:
  issues:
    types: [opened, reopened]
jobs:
  add-to-project:
    # Only the team's issues reach the board: the repos are public by ADR-003.
    # Matched on the login and not on author_association, which the webhook
    # derives from public membership and reports as NONE while ours is private.
    if: contains(fromJSON('["tommycass", "FedeTrejo", "joaquinleondev", "alejovillores"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/tds-g3-2s2026/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
