name: Agregar issues al Project
on:
  issues:
    types: [opened, reopened]
jobs:
  add-to-project:
    # Only the team's issues reach the board. The repos are public by ADR-003,
    # so anyone with a GitHub account can open one and without this filter it
    # lands on the Kanban the tutor reviews.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/tds-g3-2s2026/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}