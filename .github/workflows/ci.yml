name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-python.yml@main
    secrets: inherit
    with:
      # ARQUITECTURA.md turns the gate on for the backend services in S3. Below
      # the minimum the PR goes red and cannot be merged.
      bloquear-por-cobertura: true

  # Only a commit on main that passed CI reaches the cluster. The pipeline and
  # what it applies are documented in udesa-x-platform, "Despliegue continuo".
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/deploy.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      servicio: users-api
      secretos: DATABASE_URL REDIS_URL JWT_PRIVATE_KEY RESEND_API_KEY INTERNAL_API_TOKEN SUPERADMIN_EMAIL SUPERADMIN_PASSWORD
      # The seed finds the account on every run after the first and does nothing.
      migracion: alembic upgrade head && python -m users_api.seed_superadmin
